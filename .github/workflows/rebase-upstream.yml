name: rebase-upstream
# Daily: when upstream main has moved past .kde-base, replay the kde commits on top of it.
# Clean replay -> pushes branch kde-rebase-<short sha> (the build-kde workflow then checks it compiles).
# Conflict -> opens an issue so a human ports the patch.
on:
  schedule: [{cron: '0 7 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: kde, fetch-depth: 0}
      - name: Replay on newest upstream tag
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "kde-rebase-bot"; git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/noctalia-dev/noctalia.git
          git fetch --force upstream main
          base=$(cat .kde-base)
          latest=$(git rev-parse upstream/main)
          short=$(git rev-parse --short "$latest")
          if [ "$latest" = "$base" ]; then echo "up to date at $base"; exit 0; fi
          if git ls-remote --exit-code --heads origin "kde-rebase-$short" >/dev/null 2>&1; then echo "already proposed"; exit 0; fi
          git checkout -q -b "kde-rebase-$short"
          if git rebase --onto "$latest" "$base" "kde-rebase-$short"; then
            echo "$latest" > .kde-base; git add .kde-base; git commit -qm "kde: base is now $short"
            git push origin "kde-rebase-$short"
          else
            git rebase --abort
            gh issue create --title "kde patches do not apply to upstream $short" \
              --body "Rebasing kde onto upstream main ($short) conflicted. Port the commits by hand."
          fi
